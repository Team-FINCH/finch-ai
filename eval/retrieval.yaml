# 검색 평가셋
#
# 우리 코퍼스에 실제로 답이 있는 질문만 담는다. 없는 답을 묻는 질문은 검색을
# 평가하지 못하고 "못 찾음"만 확인시켜 준다.
#
# 정답은 문서 제목의 부분 문자열로 지정한다. 청크 id는 재적재하면 바뀌고,
# 문서 id는 사람이 읽을 수 없다.
#
# 실행: python -m eval.run --retrieval
# 임베딩 키가 없으면 자동으로 건너뛴다.

version: 2
corpus_note: |
  2026-08-25 재적재 기준 — 시드 포트폴리오 8종목의 최근 90일 공시
  216건 · 청크 10,195개(KB금융 반기보고서가 6,110개로 절반 이상).
  코퍼스를 다시 적재하면 이 평가셋도 같이 손봐야 한다 — 문서가 바뀌면
  정답도 바뀐다. v1 의 합병·유한양행(000100) 케이스는 현 코퍼스에
  문서가 없어 답이 불가능하므로 실제 존재하는 문서로 갈아엎었다.

baseline: |
  2026-08-19 · text-embedding-3-small · 1024차원 · 청크 2,280건 전부 임베딩
  Recall@5 = 0.875 (7/8). 유일한 실패는 treasury-cancel이다.

  원인은 밀집 검색의 어휘 약점이다. 소각 공시 청크에 "주식 소각 결정"이 이미
  여러 번 들어 있는데도 질의와의 유사도가 0.4366에 그쳐, 회사별 반기보고서
  8건(0.46~0.51)에 밀린다. 한 문서가 상위를 독식해서가 아니므로 문서당 조각
  수를 1·2·무제한으로 바꿔 재봐도 셋 다 0.875였다 — 캡은 해법이 아니다.

  청크 앞에 문서 제목을 붙이면 0.4366 → 0.4738로 오르고 같은 처리를 한
  반기보고서는 0.3788로 내려간다. 근본 해법은 하이브리드 검색(Postgres
  tsvector + 벡터)이다. 어휘가 그대로 겹치는 질의라 BM25 쪽이 쉽게 잡는다.

  ── 2026-08-25 · 코퍼스 ×4.5 확장 후 밀집 단독 재측정 ──
  Recall@5 = 0.375 (3/8). KB금융 반기보고서 조각들이 상위를 독식했다.
  확장이 밀집 단독의 스케일 한계를 드러낸 실측이며, 하이브리드 도입 근거다.
  평가셋 v2 — 현 코퍼스에 실존하는 문서 기준으로 갈아엎었다.

cases:
  # ── 특정 사건을 찾는 질문 ────────────────────────────
  - id: treasury-cancel
    query: 자기주식을 소각하기로 한 곳이 있나요?
    ticker: null
    expect_title_contains: [주식소각결정]
    why: 주식소각결정 공시가 있다. 소각과 취득을 구분하는지 본다.

  - id: shareholder-holding
    query: 대량보유 상황이 보고된 종목이 있나요?
    ticker: null
    expect_title_contains: [주식등의대량보유상황보고서]
    why: 약식과 일반 두 형태가 있다. 하나만 top-k 에 들면 통과.

  - id: rumor-clarification
    query: 시장에 돈 풍문에 대해 회사가 해명한 사례를 찾아줘
    ticker: null
    expect_title_contains: [풍문또는보도에대한해명]
    why: 제목 어휘(풍문/해명)가 질의와 거의 겹친다. 어휘 경로의 기본값.

  - id: derivatives-loss
    query: 파생상품 거래에서 손실이 발생한 공시가 있나요?
    ticker: null
    expect_title_contains: [파생상품거래손실발생]
    why: 본문에 손실 금액이 있고 제목에 유형이 있다.

  - id: rights-issue
    query: 유상증자를 결정한 종목은 어디야?
    ticker: null
    expect_title_contains: [유상증자결정]
    why: 주요사항보고서 괄호 안 접미사까지 정확히 맞혀야 한다.

  - id: major-shareholder-change
    query: 최대주주의 지분 변동이 신고된 종목이 있나요?
    ticker: null
    expect_title_contains: [최대주주등소유주식변동신고서]
    why: 대량보유 보고와 어휘가 겹친다(보고·주주). 구분력을 본다.

  # ── 정기보고서 본문을 파고드는 질문 ──────────────────
  - id: 半期-사업내용
    query: 반기보고서에서 회사의 주요 사업 내용을 설명한 부분
    ticker: "005930"
    expect_title_contains: [반기보고서]
    why: 삼성전자 반기보고서는 청크가 수백 개라 그중 사업 설명 부분을 집어내야 한다.

  # ── 없는 답을 묻는 질문 (오탐 확인) ──────────────────
  - id: absent-launch
    query: 우주 발사체 사업에 진출한다는 공시가 있나요?
    ticker: null
    expect_title_contains: []
    expect_empty: true
    why: |
      코퍼스 어느 종목도 발사체 사업이 없다. 무엇이든 상위에 올려놓는
      검색인지 확인한다. 임계 없는 top-k 는 항상 무언가를 반환한다 —
      그 사실 자체를 기록해두려는 항목이다.
