name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ai_invest
          POSTGRES_PASSWORD: ai_invest
          POSTGRES_DB: ai_invest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_invest -d ai_invest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      # 확장 생성은 초기 마이그레이션이 담당하므로 여기서 따로 만들지 않는다.
      DATABASE_URL: postgresql+asyncpg://ai_invest:ai_invest@localhost:5432/ai_invest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 린트
        run: ruff check .

      - name: 마이그레이션 적용
        run: alembic upgrade head

      - name: 마이그레이션 드리프트 검사
        # 모델만 고치고 마이그레이션을 빠뜨리면 여기서 잡힌다.
        # 여러 트랙이 병렬로 스키마를 건드릴 때 가장 조용히 깨지는 지점이다.
        run: alembic check

      - name: 테스트
        run: pytest -q

      - name: 설계 문서 최신 여부
        # HTML을 고치고 Markdown 재생성을 잊으면 에이전트가 낡은 문서를 읽는다.
        # 변환 스크립트가 아직 머지되지 않은 브랜치에서는 건너뛴다.
        run: |
          if [ -f scripts/html2md.py ]; then
            python scripts/html2md.py --check
          else
            echo "scripts/html2md.py 없음 — 건너뜀"
          fi
