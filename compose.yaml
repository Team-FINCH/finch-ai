services:
  db:
    image: pgvector/pgvector:pg17
    container_name: ai_invest_db
    environment:
      POSTGRES_USER: ai_invest
      POSTGRES_PASSWORD: ai_invest
      POSTGRES_DB: ai_invest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_invest -d ai_invest"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
